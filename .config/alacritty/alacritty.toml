[general]
import = ["~/dotfiles/.config/alacritty/colors.toml"]
live_config_reload = true

[env]
TERM = "xterm-256color"

[font]
size = 7.1
normal = { family = "Pixel Code" }
bold = { family = "Pixel Code" }
italic = { family = "Pixel Code" }
bold_italic = { family = "Pixel Code" }

[window]
padding.x = 5
padding.y = 5
dynamic_padding = true
opacity = 1

[keyboard]
bindings = [
    # { key="k", mods="Control", action="ScrollLineUp" },
    # { key="j", mods="Control", action="ScrollLineDown" },

    { key="k", mods="Control|Shift", action="ScrollHalfPageUp" },
    { key="j", mods="Control|Shift", action="ScrollHalfPageDown" },

    { key="g", mods="Control|Shift", action="ScrollToBottom" },
    { key="g", mods="Control", action="ScrollToTop" },

    { key="s", mods="Control|Shift", action="SearchForward" },
]
